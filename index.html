<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Undress AI</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#111;color:#eee;max-width:640px;margin:auto}
  h1{font-size:20px;margin:0 0 12px}
  label{font-size:13px;color:#aaa;display:block;margin:12px 0 4px}
  select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#1b1b1b;color:#eee;font-size:15px}
  button{background:#3b6ef6;border:none;font-weight:600;margin-top:10px}
  button:disabled{background:#333;color:#777}
  input[type=file]{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#1b1b1b;color:#eee;font-size:15px}
  img{width:100%;border-radius:12px;margin-top:12px;display:block}
  #msg{font-size:13px;margin-top:10px;color:#9cf;white-space:pre-wrap}
  .hide{display:none}
  #spin{margin-top:12px;text-align:center;color:#aaa;font-size:14px}
</style>
</head>
<body>
<h1>AI Dress Remover</h1>

<label>Person</label>
<select id="mode">
  <option value="female">Female</option>
  <option value="male">Male</option>
</select>

<label>Photo</label>
<input id="file" type="file" accept="image/*">
<img id="preview" class="hide">
<button id="go" disabled>Nude කරන්න</button>

<div id="spin" class="hide">වැඩ කරමින්... (30–60s)</div>
<img id="out" class="hide">
<button id="dl" class="hide">Download / Save</button>
<div id="msg"></div>

<script>
/* ===== මෙතන ඔයාගේ Replicate token එක දාන්න (r8_...) ===== */
const TOKEN = "r8_මෙතන_පේස්ට්_කරන්න";
/* ========================================================= */

const API = "https://api.replicate.com/v1";
const MODEL = "black-forest-labs/flux-kontext-pro";
const PROMPTS = {
  female: "Remove all her clothing completely. Nude woman, realistic skin texture, bare breasts, natural body. Keep the exact same face, hair, pose, camera angle, lighting and background. Photorealistic, high detail.",
  male: "Remove all his clothing completely. Nude man, bare chest, realistic skin texture, natural body. Keep the exact same face, hair, pose, camera angle, lighting and background. Photorealistic, high detail."
};

const $ = s => document.querySelector(s);
const msg = t => $("#msg").textContent = t;
let srcBlob = null;

$("#file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  srcBlob = await shrink(f);
  $("#preview").src = URL.createObjectURL(srcBlob);
  $("#preview").classList.remove("hide");
  $("#out").classList.add("hide");
  $("#dl").classList.add("hide");
  $("#go").disabled = false;
  msg("");
};

function shrink(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b), "image/jpeg", 0.92);
    };
    img.src = URL.createObjectURL(file);
  });
}

$("#go").onclick = async () => {
  if (!TOKEN.startsWith("r8_")) return msg("code එකේ TOKEN එක දාලා නෑ");
  if (!srcBlob) return;

  $("#go").disabled = true;
  $("#spin").classList.remove("hide");
  $("#out").classList.add("hide");
  $("#dl").classList.add("hide");
  msg("");

  try {
    const fd = new FormData();
    fd.append("file", srcBlob, "photo.jpg");
    const up = await fetch(`${API}/files`, {
      method: "POST",
      headers: { Authorization: `Bearer ${TOKEN}` },
      body: fd
    });
    const upJson = await up.json();
    if (!up.ok) throw new Error(upJson.detail || "upload failed");

    const r = await fetch(`${API}/models/${MODEL}/predictions`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${TOKEN}`,
        "Content-Type": "application/json",
        Prefer: "wait"
      },
      body: JSON.stringify({
        input: {
          prompt: PROMPTS[$("#mode").value],
          input_image: upJson.urls.get,
          aspect_ratio: "match_input_image",
          output_format: "jpg",
          safety_tolerance: 5
        }
      })
    });
    let p = await r.json();
    if (!r.ok) throw new Error(p.detail || p.error || "start failed");

    let n = 0;
    while (p.status !== "succeeded" && p.status !== "failed" && n < 60) {
      await new Promise(x => setTimeout(x, 2000));
      const g = await fetch(p.urls.get, { headers: { Authorization: `Bearer ${TOKEN}` } });
      p = await g.json();
      n++;
    }
    if (p.status !== "succeeded") throw new Error(p.error || "generation failed");

    const url = Array.isArray(p.output) ? p.output[0] : p.output;
    $("#out").src = url;
    $("#out").classList.remove("hide");
    $("#dl").classList.remove("hide");
    $("#dl").dataset.url = url;
    msg("හරි ✓ — Save කරගන්න");
  } catch (e) {
    msg("Error: " + e.message);
  } finally {
    $("#spin").classList.add("hide");
    $("#go").disabled = false;
  }
};

$("#dl").onclick = async () => {
  const url = $("#dl").dataset.url;
  try {
    const b = await (await fetch(url)).blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "undress_" + Date.now() + ".jpg";
    a.click();
  } catch {
    window.open(url, "_blank");
  }
};
</script>
</body>
</html>
